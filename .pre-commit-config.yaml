# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: local
    hooks:
      - id: clang-format
        name: C++ Formatting (clang-format)
        description: Format C++ source and header files with clang-format
        entry: clang-format -i
        language: system
        files: ^src/.*\.(cpp|h)$
        types: [file]

      - id: qmlformat
        name: QML Formatting (qmlformat)
        description: Format QML files with Qt qmlformat
        entry: bash -c 'if command -v qmlformat >/dev/null 2>&1; then exec qmlformat --inplace "$@"; else exec qmlformat-qt6 --inplace "$@"; fi' --
        language: system
        files: ^src/.*\.qml$
        types: [file]

      - id: qmllint
        name: QML Linting (qmllint)
        description: Verify QML files against qmllint rules
        entry: bash -c 'if command -v qmllint >/dev/null 2>&1; then exec qmllint -I build -I build-release -I build-relwithdebinfo "$@"; else exec qmllint-qt6 -I build -I build-release -I build-relwithdebinfo "$@"; fi' --
        language: system
        files: ^src/ui/.*\.qml$
        types: [file]
